apiVersion: v2
name: fieldservice-app
description: >-
  Couchbase telecom field service demo on Kubernetes: Couchbase Server (network
  sites from the daily Databricks export), Sync Gateway (Couchbase Lite
  replication for technicians' phones), the backend (FastAPI + the telco-field-service MCP
  server, which registers itself with the Couchbase Agent Operations Manager),
  the app in a browser, and a daily CronJob that drops a new mock Databricks
  export.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords: [couchbase, couchbase-lite, sync-gateway, mcp, rag, offline-first, databricks]
